name: Verifiche

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    name: Test, tipi e stile del codice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npx tsc --noEmit
      - name: Controllo dello stile del codice (ESLint)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test prestazioni catalogo ed editor creature
        run: npm run test:catalog-performance && npm run test:creature-editor

  # The browser tests in two halves at the same time (Playwright shards): each half has its own production build
  # and its own in-memory test database, never the real one. In one job everything took about 50 minutes.
  prove-browser:
    name: Build e prove nel browser (parte ${{ matrix.parte }} di 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium, WebKit and Firefox: the compatibility test of every engine (e2e/compatibilita-*.spec.mjs).
      # PROMPT 73: the system packages (~185 .deb, ~139 MB) came from the Ubuntu mirror at ~240 kB/s and the step
      # went past its 10 minutes. Now browsers and .deb files are in the GitHub cache, keyed on the system and on
      # the Playwright version of package-lock.json; scripts/ci-browser-deps.sh installs from the cache without
      # apt-get update and uses the mirror only for what is missing (retries, two attempts, 20 minutes in all).
      - name: Versione di Playwright e sistema
        id: pw
        run: |
          echo "versione=$(node -p 'require("./package-lock.json").packages["node_modules/playwright-core"].version')" >> "$GITHUB_OUTPUT"
          . /etc/os-release
          echo "sistema=${ID}-${VERSION_ID}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
      - name: Browser dalla cache
        id: cache-browser
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browser-${{ steps.pw.outputs.sistema }}-${{ steps.pw.outputs.versione }}
      # The newest saved set of .deb files for this system and Playwright version (a new one is saved only when
      # something had to come from the mirror).
      - name: Pacchetti di sistema dalla cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pw-apt-debs
          key: pw-apt-${{ steps.pw.outputs.sistema }}-${{ steps.pw.outputs.versione }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pw-apt-${{ steps.pw.outputs.sistema }}-${{ steps.pw.outputs.versione }}-
      - name: Browser per le prove
        id: browser
        timeout-minutes: 20
        run: bash scripts/ci-browser-deps.sh
      - name: Salva i browser in cache
        if: steps.cache-browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-browser-${{ steps.pw.outputs.sistema }}-${{ steps.pw.outputs.versione }}
      - name: Salva i pacchetti di sistema in cache
        if: steps.browser.outputs.pacchetti-da-salvare == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pw-apt-debs
          key: pw-apt-${{ steps.pw.outputs.sistema }}-${{ steps.pw.outputs.versione }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build e prove nel browser
        run: npm run test:e2e -- --shard=${{ matrix.parte }}/2
      - name: Tracce delle prove fallite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.parte }}
          path: test-results/
          retention-days: 7
