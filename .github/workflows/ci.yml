name: Verifiche

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifiche:
    name: Test, tipi, build e prove nel browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Test prestazioni catalogo ed editor creature
        run: npm run test:catalog-performance && npm run test:creature-editor
      - name: Browser per le prove
        run: npx playwright install --with-deps chromium
      # Production build and browser tests on an in-memory test database: never the real one.
      - name: Build e prove nel browser
        run: npm run test:e2e
      - name: Tracce delle prove fallite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
