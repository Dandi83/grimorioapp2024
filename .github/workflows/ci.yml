name: Verifiche

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    name: Test, tipi e stile del codice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npx tsc --noEmit
      - name: Controllo dello stile del codice (ESLint)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test prestazioni catalogo ed editor creature
        run: npm run test:catalog-performance && npm run test:creature-editor

  # The browser tests in two halves at the same time (Playwright shards): each half has its own production build
  # and its own in-memory test database, never the real one. In one job everything took about 50 minutes.
  prove-browser:
    name: Build e prove nel browser (parte ${{ matrix.parte }} di 2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # WebKit and Firefox: the compatibility test of every engine (e2e/compatibilita-*.spec.mjs).
      # On 27 October 2026 this step hung for 70 minutes once: now it stops after 10 and the job can run again.
      - name: Browser per le prove
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Build e prove nel browser
        run: npm run test:e2e -- --shard=${{ matrix.parte }}/2
      - name: Tracce delle prove fallite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.parte }}
          path: test-results/
          retention-days: 7
